<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eraserGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9a8d4;stop-opacity:1" />
    </linearGradient>
    <filter id="eraserShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Eraser body -->
  <rect x="4" y="8" width="16" height="6" rx="1" fill="url(#eraserGradient)" stroke="#b45309" stroke-width="0.5" filter="url(#eraserShadow)"/>
  <!-- Pink eraser tip -->
  <rect x="3" y="9" width="3" height="4" rx="0.5" fill="url(#pinkGradient)" stroke="#ec4899" stroke-width="0.3"/>
  <!-- Metal band -->
  <rect x="6" y="8.5" width="1" height="5" fill="#9ca3af"/>
  <!-- Highlight -->
  <rect x="8" y="9" width="10" height="1" fill="#fef3c7" opacity="0.7"/>
</svg>
